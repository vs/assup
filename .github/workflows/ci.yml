name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      # Disposable database for the integration tests; they wipe tables in beforeEach.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: assup
          POSTGRES_DB: assup_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U assup -d assup_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://assup@localhost:5432/assup_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client and apply migrations
        working-directory: backend
        run: |
          npx prisma generate
          npx prisma migrate deploy

      - name: Typecheck backend
        working-directory: backend
        run: npx tsc --noEmit

      - name: Typecheck frontend
        working-directory: frontend
        run: npx tsc -b

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Backend tests
        working-directory: backend
        run: npm run test:run
