services:
  postgres:
    image: postgres:16-alpine
    container_name: assup-postgres
    environment:
      POSTGRES_USER: assup
      POSTGRES_PASSWORD: ${DB_PASSWORD:-assup_dev}
      POSTGRES_DB: assup
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - assup-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assup"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - assup-default

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: assup-backend
    container_name: assup-backend
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - BIND_ADDRESS=0.0.0.0
      - IB_HOST=host.docker.internal
      - IB_PORT=7496
      - DATABASE_URL=postgresql://assup:${DB_PASSWORD:-assup_dev}@postgres:5432/assup
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - MARKET_DATA_API_KEY=${MARKET_DATA_API_KEY:-}
      - MARKET_DATA_PROVIDER=${MARKET_DATA_PROVIDER:-polygon}
      - SYNTHESIZER_MODE=${SYNTHESIZER_MODE:-api}
      - SCHEDULER_ENABLED=${SCHEDULER_ENABLED:-false}
      - CLAUDE_CODE_OAUTH_TOKEN=${CLAUDE_CODE_OAUTH_TOKEN:-}
      - SA_EMAIL=${SA_EMAIL:-}
      - SA_PASSWORD=${SA_PASSWORD:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # 127.0.0.1, not localhost: Alpine resolves localhost to ::1 first, and
      # the server binds IPv4-only 0.0.0.0 (BIND_ADDRESS above).
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - assup-default

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: assup-frontend
    container_name: assup-frontend
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - assup-default

networks:
  assup-default:
    name: assup-default

volumes:
  assup-postgres-data:
    external: true
