services:
  backend:
    build: ./backend
    ports:
      - "3000:3000"
    environment:
      - IB_HOST=host.docker.internal
      - IB_PORT=7497
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
