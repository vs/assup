services:
  postgres:
    image: postgres:16-alpine
    container_name: assup-postgres
    environment:
      POSTGRES_USER: assup
      POSTGRES_PASSWORD: ${DB_PASSWORD:-assup_dev}
      POSTGRES_DB: assup
    ports:
      - "5432:5432"
    volumes:
      - assup-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assup"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - assup-default

  research-db:
    image: postgres:16-alpine
    container_name: assup-research-db
    environment:
      POSTGRES_USER: research
      POSTGRES_PASSWORD: ${RESEARCH_DB_PASSWORD:-research_dev}
      POSTGRES_DB: research
    ports:
      - "5433:5432"
    volumes:
      - assup-research-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U research -d research"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - assup-default

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: assup-backend
    container_name: assup-backend
    ports:
      - "3000:3000"
    environment:
      - IB_HOST=host.docker.internal
      - IB_PORT=7497
      - DATABASE_URL=postgresql://assup:${DB_PASSWORD:-assup_dev}@postgres:5432/assup
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - assup-default

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: assup-frontend
    container_name: assup-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - assup-default

networks:
  assup-default:
    name: assup-default

volumes:
  assup-postgres-data:
    external: true
  assup-research-data:
